# OX — full-stack app (web + api) against the hosted Supabase project
# xaepcwnqjwphuwvuekfb. No local database: Supabase IS the database.
#   cp .env.example .env   # fill the Supabase service key + Stripe secrets
#   docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "4000"
      WEB_ORIGIN: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-https://xaepcwnqjwphuwvuekfb.supabase.co}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_ZzRzJgf-NQ3g5sR6i48m8g_HbMD_DMM}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      SUPABASE_JWT_SECRET: "${SUPABASE_JWT_SECRET:-}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-https://xaepcwnqjwphuwvuekfb.supabase.co}"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_ZzRzJgf-NQ3g5sR6i48m8g_HbMD_DMM}"
        NEXT_PUBLIC_OX_API_URL: "${NEXT_PUBLIC_OX_API_URL:-http://localhost:4000/api/v1}"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL:-https://xaepcwnqjwphuwvuekfb.supabase.co}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_ZzRzJgf-NQ3g5sR6i48m8g_HbMD_DMM}"
      NEXT_PUBLIC_OX_API_URL: "${NEXT_PUBLIC_OX_API_URL:-http://localhost:4000/api/v1}"
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
