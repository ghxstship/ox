# OX — OPTIONAL local infrastructure for fully-offline dev only.
# The default backend is Supabase (xaepcwnqjwphuwvuekfb); you do NOT need this to run OX.
# Use only to run OX against a local Postgres (then point DATABASE_URL here and run db:seed:fresh).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ox
      POSTGRES_PASSWORD: ox
      POSTGRES_DB: ox
    ports: ["5432:5432"]
    volumes: ["ox_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ox"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ox
      MINIO_ROOT_PASSWORD: oxoxoxox
    ports: ["9000:9000", "9001:9001"]
    volumes: ["ox_minio:/data"]
volumes:
  ox_pg:
  ox_minio:
